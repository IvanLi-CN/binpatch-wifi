pre-commit:
  parallel: true
  commands:
    check:
      run: bun run check

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck
    test:
      run: bun run test
    cargo-test:
      run: cargo test
